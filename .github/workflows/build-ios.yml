name: Build iOS IPA (Nexus Manga)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate iOS native code)
        run: |
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned iOS Archive & IPA
        run: |
          cd ios
          xcodebuild clean archive \
            -workspace NexusManga.xcworkspace \
            -scheme NexusManga \
            -configuration Release \
            -archivePath build/NexusManga.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p ../Payload
          cp -r build/NexusManga.xcarchive/Products/Applications/*.app ../Payload/ || true
          cd ..
          zip -r Nexus-iOS.ipa Payload

      - name: Upload GoFile Backup
        run: |
          echo "Uploading to GoFile.io..."
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          curl -s -F "file=@Nexus-iOS.ipa" https://${SERVER}.gofile.io/uploadFile || true
          echo ""

      - name: Upload Build Artifact (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-iOS.ipa
          path: Nexus-iOS.ipa
          retention-days: 7
